services:
  app1:
    build:
      context: ./app1
    container_name: app1
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - APP_NUMBER=2
      - DB_URI: "${DB_URI}"
    networks:
      - app_net
  app2:
    build:
      context: ./app2
    container_name: app2
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - APP_NUMBER=2
      - DB_URI: "${DB_URI}"
    networks:
      - app_net
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - app_net

  prometheus:
    build:
      context: ./prometheus
      platforms:
        - linux/amd64
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "9090:9090"
    depends_on:
      - app1
      - app2
    platform: linux/amd64
    networks:
      - app_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/config.ini:/etc/grafana/grafana.ini
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/default.yaml
      - ./grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/default.yaml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    platform: linux/amd64
    networks:
      - app_net

volumes:
  grafana-storage:

networks:
  app_net:
    driver: bridge
