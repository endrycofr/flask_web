version: "3.8"

services:
  app:
    build:
      context: ./app
    container_name: app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # DB_URI bisa ditulis langsung di .env
      DB_URI: "${DB_URI}"
    networks:
      - app_net

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app_net

  prometheus:
    build:
      context: ./prometheus
      platforms:
        - linux/arm64
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - app_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/config.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro
      - ./grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/default.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - app_net

volumes:
  grafana-storage:

networks:
  app_net:
    driver: bridge
